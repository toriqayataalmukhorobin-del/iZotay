name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev pkg-config

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Rust quality tools
        run: rustup component add rustfmt clippy --toolchain stable

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run tests
        run: cargo +stable test

      - name: Run Clippy
        run: cargo +stable clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo +stable build --release

      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP "izotay"
          $releaseDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item target/release/izotay.exe $bundleDir
          Copy-Item -Path PANDUAN-PAKET.md,PANDUAN-PENGGUNA.md -Destination $bundleDir
          $archive = Join-Path $releaseDir "izotay-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $archive -CompressionLevel Optimal
          choco install innosetup -y --no-progress
          $iss = Join-Path $env:RUNNER_TEMP "izotay.iss"
          @"
          [Setup]
          AppId={{28CA71CB-D7D0-4683-B813-5DE436E0522A}
          AppName=iZotay
          AppVersion=0.2.1
          AppPublisher=iZotay contributors
          DefaultDirName={autopf}\iZotay
          DefaultGroupName=iZotay
          OutputDir=$releaseDir
          OutputBaseFilename=izotay-$env:RUNNER_OS-$env:RUNNER_ARCH-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayIcon={app}\izotay.exe
          [Files]
          Source: "$bundleDir\izotay.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$bundleDir\PANDUAN-PAKET.md"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$bundleDir\PANDUAN-PENGGUNA.md"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{group}\iZotay"; Filename: "{app}\izotay.exe"
          Name: "{autodesktop}\iZotay"; Filename: "{app}\izotay.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; Flags: unchecked
          [Run]
          Filename: "{app}\izotay.exe"; Description: "Launch iZotay"; Flags: postinstall nowait skipifsilent
          "@ | Set-Content -Path $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          "IZOTAY_OUTPUT_DIR=$releaseDir" >> $env:GITHUB_ENV

      - name: Package Unix preview
        if: runner.os != 'Windows'
        run: |
          bundle_dir="$RUNNER_TEMP/izotay"
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$bundle_dir"
          mkdir -p "$release_dir"
          cp target/release/izotay PANDUAN-PAKET.md PANDUAN-PENGGUNA.md "$bundle_dir/"
          archive="$release_dir/izotay-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP" izotay
          if [ "$RUNNER_OS" = "Linux" ]; then
            package_root="$RUNNER_TEMP/deb-root"
            mkdir -p "$package_root/DEBIAN" "$package_root/usr/bin" "$package_root/usr/share/doc/izotay" "$package_root/usr/share/applications"
            install -m 0755 target/release/izotay "$package_root/usr/bin/izotay"
            install -m 0644 PANDUAN-PAKET.md PANDUAN-PENGGUNA.md "$package_root/usr/share/doc/izotay/"
            cat > "$package_root/usr/share/applications/izotay.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=iZotay
          Comment=Non-destructive dialogue audio editor
          Exec=izotay
          Icon=applications-multimedia
          Terminal=false
          Categories=AudioVideo;Audio;
          DESKTOP
            cat > "$package_root/DEBIAN/control" <<'CONTROL'
          Package: izotay
          Version: 0.2.1
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libasound2 | libasound2t64, libgl1, libx11-6, libxkbcommon0, libwayland-client0
          Recommends: ffmpeg
          Maintainer: iZotay contributors
          Description: Non-destructive multitrack audio restoration editor
           Desktop editor for dialogue restoration and video audio editing.
          CONTROL
            dpkg-deb --build --root-owner-group "$package_root" "$release_dir/izotay-${RUNNER_OS}-${RUNNER_ARCH}.deb"
          else
            app_dir="$RUNNER_TEMP/Izotay.app/Contents"
            mkdir -p "$app_dir/MacOS" "$app_dir/Resources"
            install -m 0755 target/release/izotay "$app_dir/MacOS/izotay"
            install -m 0644 PANDUAN-PAKET.md PANDUAN-PENGGUNA.md "$app_dir/Resources/"
            cat > "$app_dir/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>iZotay</string>
          <key>CFBundleDisplayName</key><string>iZotay</string>
          <key>CFBundleIdentifier</key><string>org.izotay.editor</string>
          <key>CFBundleExecutable</key><string>izotay</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.2.1</string>
          <key>CFBundleVersion</key><string>0.2.1</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
            hdiutil create -volname iZotay -srcfolder "$RUNNER_TEMP/Izotay.app" -ov -format UDZO "$release_dir/izotay-${RUNNER_OS}-${RUNNER_ARCH}.dmg"
          fi
          echo "IZOTAY_OUTPUT_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: izotay-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.IZOTAY_OUTPUT_DIR }}/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download platform preview packages
        uses: actions/download-artifact@v4
        with:
          pattern: izotay-*
          path: dist
          merge-multiple: true

      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "iZotay $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

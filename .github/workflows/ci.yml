name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-dev pkg-config

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }

      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Rust quality tools
        run: rustup component add rustfmt clippy --toolchain stable

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run tests
        run: cargo +stable test

      - name: Run Clippy
        run: cargo +stable clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo +stable build --release

      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP "izotay"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Copy-Item target/release/izotay.exe $bundleDir
          Copy-Item -Path PANDUAN-PAKET.md,PANDUAN-PENGGUNA.md -Destination $bundleDir
          $archive = Join-Path $env:RUNNER_TEMP "izotay-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $archive -CompressionLevel Optimal
          "IZOTAY_PACKAGE=$archive" >> $env:GITHUB_ENV

      - name: Package Unix preview
        if: runner.os != 'Windows'
        run: |
          bundle_dir="$RUNNER_TEMP/izotay"
          mkdir -p "$bundle_dir"
          cp target/release/izotay PANDUAN-PAKET.md PANDUAN-PENGGUNA.md "$bundle_dir/"
          archive="$RUNNER_TEMP/izotay-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP" izotay
          echo "IZOTAY_PACKAGE=$archive" >> "$GITHUB_ENV"

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: izotay-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.IZOTAY_PACKAGE }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download platform preview packages
        uses: actions/download-artifact@v4
        with:
          pattern: izotay-*
          path: dist
          merge-multiple: true

      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "iZotay $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

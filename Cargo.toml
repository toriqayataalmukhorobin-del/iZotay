[package]
name = "izotay"
version = "0.1.0"
edition = "2024"
description = "Local multi-track dialog restoration editor prototype"
license = "MIT"

[dependencies]
cpal = "0.15"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
hound = "3.5"
memmap2 = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
